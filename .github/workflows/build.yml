name: Build PKG
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Dependencias
        run: sudo apt-get update && sudo apt-get install -y clang lld unzip
      - name: libssl 1.1
        run: |
          wget -q http://archive.ubuntu.com/ubuntu/pool/main/o/openssl/libssl1.1_1.1.1f-1ubuntu2_amd64.deb -O libssl.deb || wget -q http://security.ubuntu.com/ubuntu/pool/main/o/openssl/libssl1.1_1.1.1f-1ubuntu2.24_amd64.deb -O libssl.deb
          sudo dpkg -i libssl.deb
      - name: Toolchain OpenOrbis
        run: |
          curl -fL -o tc.tar.gz https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.4/toolchain-llvm-18.tar.gz
          mkdir tc && tar -xzf tc.tar.gz -C tc
          LINKX=$(find tc -name link.x | head -n1)
          TC=$(dirname "$LINKX")
          chmod -R +x "$TC/bin/linux" || true
          echo "OO_PS4_TOOLCHAIN=$PWD/$TC" >> $GITHUB_ENV
      - name: Compilar
        env:
          CLR_OPENSSL_VERSION_OVERRIDE: "1.1"
        run: |
          unzip -q rey-del-numero-ps4.zip
          cd rey-del-numero
          RA=$(find "$OO_PS4_TOOLCHAIN" -name right.sprx | head -n1)
          if [ -n "$RA" ]; then mkdir -p sce_sys/about && cp "$RA" sce_sys/about/right.sprx; fi
          set -o pipefail
          make 2>&1 | tee ../build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultado
          path: |
            build.log
            rey-del-numero/*.pkg
